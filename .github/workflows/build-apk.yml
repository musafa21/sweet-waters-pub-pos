name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip openjdk-17-jdk cmake autoconf libtool \
            pkg-config build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev curl \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev \
            libncurses5-dev libtinfo5

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Cython
          pip install https://github.com/kivy/buildozer/archive/refs/heads/master.zip

      - name: Copy source to Linux FS
        run: |
          cp -r . ~/build_app
          cd ~/build_app

      - name: Build APK
        run: |
          cd ~/build_app
          yes | buildozer android debug 2>&1 || true
          ls -la bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-waters-pub-apk
          path: ~/build_app/bin/*.apk
          if-no-files-found: warn
          retention-days: 30
